name: CassettePlayer
options:
  bundleIdPrefix: com.cassetteplayer
  deploymentTarget:
    iOS: "9.0"
  xcodeVersion: "11.7"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "9.0"
    ARCHS: "armv7 armv7s arm64"
    VALID_ARCHS: "armv7 armv7s arm64"
    ONLY_ACTIVE_ARCH: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_NAME: CassettePlayer
    INFOPLIST_FILE: CassettePlayer/Info.plist
targets:
  CassettePlayer:
    type: application
    platform: iOS
    deploymentTarget: "9.0"
    sources:
      - path: CassettePlayer
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: CassettePlayer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cassetteplayer.lossless
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-ObjC"
    frameworks:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: MobileCoreServices.framework
      - sdk: SystemConfiguration.framework
    dependencies: []
    preBuildScripts: []
